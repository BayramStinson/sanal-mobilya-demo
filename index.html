<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaman Öğrenci Rehberi | TÜBİTAK 2209-A</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />

    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #212529;
            --logo-bg: #ffffff;
        }
        body.dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --logo-bg: #1e1e1e;
        }
        body.dark-mode .text-muted { color: #adb5bd !important; }
        body.dark-mode .text-dark { color: #fff !important; }
        body.dark-mode .bg-light { background-color: #2c2c2c !important; }

        html, body {
            overflow-x: hidden;
            width: 100%;
            color: var(--text-color);
            transition: background-color 0.3s;
            background-color: transparent !important;
        }

        /* NAVBAR */
        .navbar-custom {
            background: linear-gradient(135deg, #2561c2 0%, #1a458c 100%);
            min-height: 80px;
            box-shadow: 0 4px 20px rgba(37, 97, 194, 0.3);
            z-index: 9999; 
            position: relative;
        }

        .navbar-nav .nav-link {
            position: relative;
            transition: all 0.3s ease;
            opacity: 0.8;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
        
        .navbar-nav .nav-link:hover, 
        .navbar-nav .nav-link.active { 
            opacity: 1;
            transform: translateY(-2px);
            text-shadow: 0 0 10px rgba(255,255,255,0.6);
            color: #fff !important;
            border-bottom: 2px solid rgba(255,255,255,0.5);
        }

        /* LOGO */
        .badge-logo-container {
            position: absolute; top: 10px; left: 20px; width: 110px; height: 110px;
            background-color: var(--logo-bg); border-radius: 50%; padding: 5px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25); z-index: 10001;
            display: flex; align-items: center; justify-content: center; transition: all 0.3s;
        }
        .badge-logo-container:hover { transform: scale(1.1) rotate(3deg); }
        .badge-logo-container img { width: 100%; height: auto; border-radius: 50%; }

        /* MOBİL */
        @media (max-width: 992px) {
            .navbar-collapse {
                background-color: #1a458c; padding: 20px; border-radius: 0 0 15px 15px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.3); position: absolute; top: 100%; left: 0; width: 100%; z-index: 9998;
            }
            .badge-logo-container { position: static; width: 50px; height: 50px; margin-right: 10px; box-shadow: none; padding: 0; background: transparent; }
            .navbar-brand-text { display: block !important; font-size: 1.2rem; }
            .navbar-nav .nav-link { padding: 10px 0; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
            .btn-login-custom { width: 100%; margin-top: 15px; }
        }
        @media (min-width: 993px) { .navbar-brand-text { display: none; } }

        .btn-login-custom { background-color: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.5); color: white; transition: all 0.3s; }
        .btn-login-custom:hover { background-color: #fff; color: #2561c2; }
        .theme-toggle-btn { background: transparent; border: none; color: rgba(255,255,255,0.8); font-size: 1.2rem; cursor: pointer; }
        .theme-toggle-btn:hover { color: #fff; transform: rotate(15deg); }

    </style>
</head>
<body>



        <div class="row mt-5 pt-5 align-items-center">
            <div class="col-lg-5 mb-4 mb-lg-0">
                <span class="badge bg-primary mb-2">YENİ TEKNOLOJİ</span>
                <h2 class="fw-bold display-6">Eşyalar Odanıza Sığacak Mı?</h2>
                <p class="lead text-muted">Artırılmış Gerçeklik (AR) teknolojisi ile mobilyaları satın almadan önce kendi odanızda görün.</p>
                <ul class="list-unstyled text-muted mt-3">
                    <li class="mb-2"><i class="fas fa-check-circle text-success me-2"></i> Kamerayı açın ve deneyin.</li>
                    <li class="mb-2"><i class="fas fa-check-circle text-success me-2"></i> Ürünü 360 derece inceleyin.</li>
                    <li class="mb-2"><i class="fas fa-check-circle text-success me-2"></i> %100 Gerçek boyutlar.</li>
                </ul>
                <button class="btn btn-dark btn-lg rounded-pill mt-3" onclick="document.getElementById('ar-button').click()">
                    <i class="fas fa-cube me-2"></i> Şimdi Dene
                </button>
            </div>
            <div class="col-lg-7">
                <div class="card border-0 shadow-lg overflow-hidden" style="border-radius: 30px;">
                    
                   <model-viewer 
                        src="img/koltuk.glb" 
                        ios-src="img/koltuk.usdz" 
                        alt="3D Mobilya Modeli" 
                        ar 
                        ar-modes="webxr scene-viewer quick-look" 
                        camera-controls 
                        auto-rotate 
                        shadow-intensity="1" 
                        style="width: 100%; height: 500px; background-color: #f8f9fa;">
                        
                        <button slot="ar-button" id="ar-button" class="btn btn-primary fw-bold position-absolute bottom-0 end-0 m-3 rounded-pill shadow-sm">
                            <i class="fas fa-camera me-2"></i> Odamda Gör
                        </button>

                    </model-viewer>
                        
                        <button slot="ar-button" id="ar-button" class="btn btn-primary fw-bold position-absolute bottom-0 end-0 m-3 rounded-pill shadow-sm">
                            <i class="fas fa-camera me-2"></i> Odamda Gör
                        </button>

                    </model-viewer>
                    </div>
            </div>
        </div>
        </div>
  
</div>

<style>
    /* Hero Yüksekliği */
    .hero-section { min-height: 85vh; }

    /* Scroll Margin */
    .scroll-margin-top { scroll-margin-top: 100px; }

    /* Slider Kartları */
    .kategori-kart {
        border-radius: 20px;
        background: #fff;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        border: 1px solid #f0f0f0 !important;
    }
    .kategori-kart:hover {
        transform: translateY(-10px);
        box-shadow: 0 15px 30px rgba(37, 97, 194, 0.15) !important;
        border-color: #2561c2 !important;
    }

    /* --- YENİ VE HAVALI SLIDER BUTONLARI --- */
    .custom-nav-btn {
        background-color: #fff;
        width: 55px; 
        height: 55px;
        border-radius: 50%;
        border: 2px solid #f8f9fa;
        box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        color: #2561c2 !important;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        opacity: 0.9;
        display: flex; align-items: center; justify-content: center; 
    }

    .custom-nav-btn:after {
        font-size: 20px !important; 
        font-weight: 900;
    }

    .custom-nav-btn:hover {
        background-color: #2561c2;
        border-color: #2561c2;
        color: #fff !important;
        opacity: 1;
        transform: scale(1.15); 
        box-shadow: 0 15px 30px rgba(37, 97, 194, 0.4); 
    }

    @media (max-width: 768px) { .custom-nav-btn { display: none; } }
    
    /* Model Viewer İlerleme Çubuğu */
    model-viewer::part(default-progress-bar) {
         background-color: #2561c2; 
         height: 5px;
    }

    .swiper-pagination-bullet { width: 10px; height: 10px; background-color: #cbd5e1; opacity: 1; transition: all 0.3s ease; }
    .swiper-pagination-bullet-active { width: 30px; border-radius: 5px; background-color: #2561c2; }
    .swiper-pagination { bottom: 0px !important; }
    
    .swiper { padding-bottom: 50px !important; padding-left: 10px; padding-right: 10px; }

    /* Dark Mode Uyumluluğu */
    body.dark-mode #kategoriler { background-color: #121212 !important; }
    body.dark-mode .curve-shape { background: #121212 !important; }
    
    /* Index Sayfasına Özel Arka Plan Ayarı */
    html, body { background-color: transparent !important; }
</style>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
<script>
    var swiper = new Swiper(".mySwiper", { slidesPerView: 1, spaceBetween: 25, loop: true, grabCursor: true, autoplay: { delay: 3500 }, pagination: { el: ".swiper-pagination", clickable: true }, navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" }, breakpoints: { 640: { slidesPerView: 1 }, 768: { slidesPerView: 2 }, 1024: { slidesPerView: 3 } } });
</script>
</body>
</html>
